# The room server (ONLINE.md 10.6): one Worker, a Room Durable Object per room
# and one Lobby. Free plan, so the objects are SQLite-backed (new_sqlite_classes).
# ADMIN_KEY is a secret (wrangler secret put ADMIN_KEY), not a var; locally it
# comes from server/.dev.vars.

name = "card-manipulator-rooms"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[vars]
SITE_ORIGIN = "https://dazeyama.github.io"
