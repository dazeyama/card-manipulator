<h1>Cursor review</h1>
<p>Every cursor the app can show, what causes it and what it means. Each is shown at real size and three times larger, on the table and on dark card art. Hover a tile to use it as your cursor.</p>

const SECTIONS = [{"title":"Over empty table","tiles":[["arrow","","Nothing held","Drag to draw a selection box"],["arrowPlus","","Ctrl held, or a Ctrl selection box","The box adds to the selection"],["arrowMinus","","Shift held, or a Shift selection box","The box takes away from the selection"],["arrowCount","","Alt held","Every pile shows its card count"]]},{"title":"Over a card","tiles":[["open","","Hovering a card","Drag to pick it up; click selects it"],["open","🧲","Shift held","Drag sweeps up the cards you pass over"],["open","🔗","Alt held (or Ctrl + Shift)","Drag moves the selection in formation"],["open","📐","Ctrl held","A drag lands tidy; a click checks the card in or out of the selection"],["open","☑️","Ctrl held, after a Ctrl + click","Checking cards in and out, until Ctrl is let go"],["open","📚","Hovering a pile's number badge","Drag lifts the whole pile"]]},{"title":"Holding cards","tiles":[["holdOne","","Dragging one card","Release to drop it"],["holdOne","📐","Dragging one card, Ctrl held","It lands squared at a quarter turn"],["fist","","Dragging several cards","Release to drop them"],["fist","📐","Dragging several, Ctrl held","They land squared at a quarter turn"],["fist","🧲","Dragging, Shift held","Sweeping up the cards passed over"],["fist","🔗","Formation drag","They move linked, keeping their layout"]]},{"title":"Playmats","tiles":[["open","","Over a mat where no card is","Drag moves the mat"],["open","🔗","Over a mat, Alt held","Drag carries the cards on it too"],["fist","","Dragging a mat","Release to place it"],["fist","🔗","Dragging a mat with Alt","Its cards ride along"],["arrow","","Over a locked mat","Acts as empty table"]]},{"title":"Camera","tiles":[["open","↔️","Space held, or right-drag","Pan"],["fist","🔄","Middle-drag","Orbit"]]},{"title":"Waiting for a click","note":"After a key that needs a place on the table. Esc cancels.","tiles":[["point","1️⃣","1 to 9 over a pile (each shows its number)","Click to deal that many as a hand"],["point","9️⃣","9 over a pile","Click to deal nine"],["point","🔢","0 over a pile, then a number over 9","Click to deal that many"],["point","🪟","X","Click to spread there, or drag a box to fit them in"],["point","","P, or the pointing-finger button beside the search box","Click to move the selection there as a stack"]]},{"title":"Action gestures","note":"Shown for half a second after the action, then the usual cursor returns. Shuffle stays until the cards settle.","tiles":[["shuffle","","S S (shuffle)","Two hands riffling, until the cards settle"],["tidy","","T","Squaring up"],["flip","","F, F F, or a middle-click","Flipping over"],["rotate","","R, R R, or R over a mat","Turning"],["fan","","H","Fanning into a hand"],["draw","","The click that deals a hand, or dealing from the hand (right-click or Space while holding)","Dealing"],["remove","❌","Delete or Backspace","Removing"]]},{"title":"Clickable things in the play space","tiles":[["point","","Buttons on badges and mats (✎, 📺, 🔒)","Click it"]]}];
const loaded = {};
const load = (src) => loaded[src] ??= new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.src = src; });

// The badge, drawn as src/ui/cursors.ts draws it: 48% of the size, 2 px in from the right, on the bottom edge.
function drawEmoji(g, emoji, size) {
  let px = Math.round(size * 0.48);
  const font = (n) => n + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.font = font(px);
  let m = g.measureText(emoji);
  const box = size * 0.48 + 2;
  const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  if (w > box || h > box) { px = Math.floor(px * Math.min(box / w, box / h)); g.font = font(px); m = g.measureText(emoji); }
  g.fillText(emoji, size - 2 - m.actualBoundingBoxRight, size - m.actualBoundingBoxDescent);
}

async function compose(art, emoji) {
  const a = ART[art];
  const img = await load(a.src);
  // Gestures keep their own size (Shuffle is 72 px); the rest are 48 px.
  const size = a.src.startsWith('data:image/svg') ? 48 : img.naturalWidth || 48;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, size, size);
  if (emoji) drawEmoji(g, emoji, 48);
  const [hx, hy] = a.hot === 'centre' ? [size / 2, size / 2] : a.hot;
  return { canvas: c, size, cursor: 'url(' + c.toDataURL() + ') ' + hx + ' ' + hy + ', auto' };
}

function scaled(source, size, k) {
  const c = document.createElement('canvas');
  c.width = c.height = size * k;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.drawImage(source, 0, 0, size * k, size * k);
  return c;
}

(async () => {
  const out = document.getElementById('out');
  for (const section of SECTIONS) {
    const h = document.createElement('h2'); h.textContent = section.title; out.append(h);
    if (section.note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = section.note; out.append(n); }
    const grid = document.createElement('div'); grid.className = 'grid'; out.append(grid);
    for (const [art, emoji, cause, means] of section.tiles) {
      const { canvas, size, cursor } = await compose(art, emoji);
      const tile = document.createElement('div'); tile.className = 'tile'; tile.style.cursor = cursor;
      for (const cls of ['table', 'dark']) {
        const row = document.createElement('div'); row.className = 'row ' + cls;
        row.append(scaled(canvas, size, 1), scaled(canvas, size, 3));
        tile.append(row);
      }
      const c = document.createElement('div'); c.className = 'cause'; c.textContent = cause;
      const m = document.createElement('div'); m.className = 'means'; m.textContent = means;
      const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = 'Hover to try it';
      tile.append(c, m, hint);
      grid.append(tile);
    }
  }
})();
